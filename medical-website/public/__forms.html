<!doctype html>
<!-- Netlify Forms üçün: deploy zamanı Netlify bu formu tapır, sayt isə müraciətləri bura göndərir. -->
<html lang="az">
  <body>
    <form name="qebul" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="qebul" />
      <input name="name" />
      <input name="phone" />
      <input name="department" />
      <input name="date" />
      <textarea name="note"></textarea>
      <input name="consent" type="checkbox" />
    </form>
  </body>
</html>
